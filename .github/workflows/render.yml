name: Render Remotion Video (1080p 60fps)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      codec:
        description: 'Video Codec (h264 or h265)'
        required: false
        default: 'h264'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Bengali Fonts & FFmpeg (Ubuntu 24.04 Noble)
        run: |
          sudo apt-get update
          sudo apt-get install -y             fonts-noto-core             fonts-beng             fonts-lohit-beng-bengali             fontconfig             ffmpeg             libnss3             libatk1.0-0t64             libatk-bridge2.0-0t64             libcups2t64             libdrm2             libxkbcommon0             libxcomposite1             libxdamage1             libxfixes3             libxrandr2             libgbm1             libasound2t64 || sudo apt-get install -y libasound2
          mkdir -p ~/.local/share/fonts
          find . -path "*/public/fonts/*.ttf" -exec cp {} ~/.local/share/fonts/ \; 2>/dev/null || true
          fc-cache -fv

      - name: Install Dependencies & Render Video (1920x1080 @ 60fps)
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          mkdir -p out

          npx remotion render Main out/calcium-myth-bone-loss.mp4             --props='{"enableAudio":true}'             --codec=${{ github.event.inputs.codec || 'h264' }}             --concurrency=100%             --gl=angle             --log=info

      - name: Upload Rendered MP4 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcium-myth-bone-loss-1080p60fps
          path: out/calcium-myth-bone-loss.mp4
          if-no-files-found: error
          retention-days: 14
